<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Console Output</title>
    <style>
        #screen-container {
            width: 100%;
            height: 90vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: black;
        }
        #output-frame {
            width: 90%;
            height: 80%;
            border: 3mm solid #8B4513;
            overflow-y: auto;
            background-color: #111;
            padding: 10px;
        }
        #output-content {
            font-family: 'Courier New', 'Consolas', 'DejaVu Sans Mono', 'Ubuntu Mono', monospace;
            color: #33FF33;
            white-space: pre-wrap;
            line-height: 1.5;
        }
        .blinking-cursor {
            display: inline-block;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div id="screen-container">
        <div id="output-frame">
            <div id="output-content"></div>
        </div>
    </div>
    <div class="controls">
        <button onclick="startDisplay()">Start</button>
        <button onclick="stopDisplay()">Stop</button>
        <button onclick="resetDisplay()">Reset</button>
        <label>Speed: <input type="range" id="speedControl" min="1" max="100" value="55" step="1" onchange="updateSpeed()"> </label>
    </div>

        window.decodeText = function(encoded) {
            try {
                const binary = atob(encoded);
                const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
                return new TextDecoder('utf-8').decode(bytes);
            } catch (e) {
                console.error('❌ Error decoding text:', e);
                return "Error decoding text.";
            }
        }

            clearTimeout(intervalId);

        window.resetDisplay = function() {
            console.log('✅ resetDisplay() called');
            stopDisplay();
            outputDiv.innerHTML = "";
            charIndex = 0;
            smoothScroll();
        }

        window.smoothScroll = function() {
            outputContainer.scrollTop = outputContainer.scrollHeight;
        }

        window.displayNextChar = function() {
            if (charIndex < text.length && isRunning) {
                const currentChar = text[charIndex];
                if (currentChar === '\n') {
                    outputDiv.innerHTML += '<br>';
                } else {
                    outputDiv.innerHTML += currentChar;
                }
                charIndex++;
                smoothScroll();
                intervalId = setTimeout(displayNextChar, displayRate);
            } else if (charIndex >= text.length) {
                outputDiv.innerHTML += '<span class="blinking-cursor">█</span>';
                smoothScroll();
                stopDisplay();
            }
